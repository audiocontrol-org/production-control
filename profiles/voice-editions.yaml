# A profile is a generic, reusable recipe binding targets to their inputs and producing tools.
# It is subject-agnostic and describes roles and transformations, not content or specific stories.
#
# `edition`'s cmd points at the REAL in-repo binaries `voice-tooling` ships — `voice-tooling/bin/
# voice-revise.mjs` and `voice-tooling/bin/voice-fidelity.mjs` (two bins; there is no
# `voice-tooling` dispatcher executable) — the exact invocation
# `tests/integration/voice-revise.test.ts` (T018/T020) exercises. Unlike `editorial-audio.yaml`'s
# `npx <name>-tooling <verb>` convention (a name-only recipe an operator resolves against an
# installed package), `npx voice-tooling …` here would resolve against an UNCLAIMED public npm
# package name on any machine without this repo's local bin on its PATH — a dependency-confusion
# risk, not merely an unresolved placeholder (AUDIT-20260726-07/-10). `pc status` never spawns a
# provider either way (`offline.test.ts` FR-010), so this cmd is only ever exec'd by `pc build`/
# `pc validate`.

version: 1
targets:
  edition:
    inputs: [source, voice]
    provider:
      cmd: [node, voice-tooling/bin/voice-revise.mjs]
      impure:
        reason: "model-produced edition; not reproducible byte-for-byte"
    validator:
      cmd: [node, voice-tooling/bin/voice-fidelity.mjs]
